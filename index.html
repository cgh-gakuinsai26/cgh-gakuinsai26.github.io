<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1f3a5f">
<title>学院祭 ポスター一覧</title>
<style>
  :root {
    --bg: #f5f3ee;
    --surface: #ffffff;
    --text: #1d1d1f;
    --muted: #6b6b70;
    --line: #e2dfd7;
    --accent: #1f3a5f;
    --accent-text: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141416;
      --surface: #1f1f23;
      --text: #f2f2f4;
      --muted: #a0a0a8;
      --line: #2e2e34;
      --accent: #8fb4e8;
      --accent-text: #0f1a2a;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif;
    line-height: 1.5;
  }
  header {
    padding: 20px 16px 12px;
    padding-top: max(20px, env(safe-area-inset-top));
    text-align: center;
  }
  header h1 { margin: 0; font-size: 1.35rem; letter-spacing: .04em; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: .85rem; }

  .tabs {
    position: sticky; top: 0; z-index: 10;
    display: flex; gap: 8px;
    padding: 10px 16px;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  .tabs button {
    flex: 1;
    padding: 12px 8px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--surface);
    color: var(--text);
    font: inherit; font-size: 1rem; font-weight: 600;
    cursor: pointer;
  }
  .tabs button[aria-selected="true"] {
    background: var(--accent); color: var(--accent-text); border-color: var(--accent);
  }
  .tabs .count { font-weight: 400; font-size: .8rem; opacity: .8; margin-left: 4px; }

  main { max-width: 960px; margin: 0 auto; padding: 8px 16px 40px; }
  .panel[hidden] { display: none; }
  .panel h2 {
    margin: 20px 0 10px; font-size: 1rem; color: var(--muted);
    border-left: 4px solid var(--accent); padding-left: 8px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
    margin: 0; padding: 0; list-style: none;
  }
  @media (min-width: 560px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (min-width: 820px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  .card {
    display: block; width: 100%;
    padding: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
    background: var(--surface); color: inherit; font: inherit; text-align: left;
    cursor: pointer;
  }
  .card img {
    display: block; width: 100%; aspect-ratio: 1 / 1.414; object-fit: cover;
    background: var(--line);
  }
  .card span { display: block; padding: 8px 10px; font-weight: 600; font-size: .95rem; }

  footer { text-align: center; color: var(--muted); font-size: .75rem; padding: 0 16px 32px; }

  /* 拡大表示 */
  .viewer {
    position: fixed; inset: 0; z-index: 100;
    display: flex; flex-direction: column;
    background: rgba(0, 0, 0, .97); color: #fff;
  }
  .viewer[hidden] { display: none; }
  .viewer-bar {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 8px 8px 16px;
    padding-top: max(8px, env(safe-area-inset-top));
  }
  .viewer-title { flex: 1; font-weight: 600; }
  .viewer-pos { color: #bbb; font-size: .85rem; }
  .viewer button {
    min-width: 44px; height: 44px;
    border: 0; border-radius: 999px;
    background: rgba(255, 255, 255, .14); color: #fff;
    font: inherit; font-size: 1.3rem; cursor: pointer;
  }
  .viewer-stage {
    flex: 1; min-height: 0;
    display: flex; align-items: center; justify-content: center;
    padding: 0 8px;
  }
  .viewer-stage img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .viewer-nav {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 16px;
    padding-bottom: max(10px, env(safe-area-inset-bottom));
  }
  .viewer-nav button { padding: 0 20px; font-size: 1rem; }
  .viewer-hint { color: #aaa; font-size: .8rem; }
</style>
</head>
<body>
<header>
  <h1>学院祭 ポスター一覧</h1>
  <p>見たい団体をタップすると大きく表示されます</p>
</header>

<nav class="tabs" role="tablist">
  <button role="tab" id="tab-class" aria-controls="panel-class" data-tab="class">クラス<span class="count" id="count-class"></span></button>
  <button role="tab" id="tab-club" aria-controls="panel-club" data-tab="club">部活<span class="count" id="count-club"></span></button>
</nav>

<main>
  <section class="panel" id="panel-class" role="tabpanel" aria-labelledby="tab-class"></section>
  <section class="panel" id="panel-club" role="tabpanel" aria-labelledby="tab-club"></section>
</main>

<footer>学院祭</footer>

<div class="viewer" id="viewer" hidden role="dialog" aria-modal="true" aria-labelledby="viewer-title">
  <div class="viewer-bar">
    <span class="viewer-title" id="viewer-title"></span>
    <span class="viewer-pos" id="viewer-pos"></span>
    <button type="button" id="viewer-close" aria-label="閉じる">✕</button>
  </div>
  <div class="viewer-stage" id="viewer-stage">
    <img id="viewer-img" alt="">
  </div>
  <div class="viewer-nav">
    <button type="button" id="viewer-prev">‹ 前</button>
    <span class="viewer-hint">左右にスワイプでも移動</span>
    <button type="button" id="viewer-next">次 ›</button>
  </div>
</div>

<script src="posters/data.js"></script>
<script>
(function () {
  var data = window.POSTERS || { classes: [], clubs: [] };
  var lists = { "class": data.classes, "club": data.clubs };

  function card(p, tab, index) {
    var li = document.createElement("li");
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "card";
    btn.addEventListener("click", function () { openViewer(tab, index); });
    var img = document.createElement("img");
    img.src = "posters/thumb/" + p.id + ".jpg";
    img.alt = p.name + " のポスター";
    img.loading = "lazy";
    img.decoding = "async";
    var label = document.createElement("span");
    label.textContent = p.name;
    btn.appendChild(img);
    btn.appendChild(label);
    li.appendChild(btn);
    return li;
  }

  function grid() {
    var ul = document.createElement("ul");
    ul.className = "grid";
    return ul;
  }

  // クラスは学年ごとに見出しを付ける
  var classPanel = document.getElementById("panel-class");
  var currentGrade = null, ul = null;
  data.classes.forEach(function (p, i) {
    var g = p.name.split("-")[0];
    if (g !== currentGrade) {
      currentGrade = g;
      var h = document.createElement("h2");
      h.textContent = g + "年";
      classPanel.appendChild(h);
      ul = grid();
      classPanel.appendChild(ul);
    }
    ul.appendChild(card(p, "class", i));
  });

  var clubPanel = document.getElementById("panel-club");
  var clubGrid = grid();
  clubGrid.style.marginTop = "16px";
  data.clubs.forEach(function (p, i) { clubGrid.appendChild(card(p, "club", i)); });
  clubPanel.appendChild(clubGrid);

  document.getElementById("count-class").textContent = data.classes.length;
  document.getElementById("count-club").textContent = data.clubs.length;

  // タブ切り替え（URL の #class / #club で状態を保持）
  var tabs = document.querySelectorAll(".tabs button");
  function showTab(name) {
    if (!lists[name]) name = "class";
    tabs.forEach(function (b) {
      var on = b.dataset.tab === name;
      b.setAttribute("aria-selected", on ? "true" : "false");
      document.getElementById("panel-" + b.dataset.tab).hidden = !on;
    });
  }
  tabs.forEach(function (b) {
    b.addEventListener("click", function () {
      showTab(b.dataset.tab);
      history.replaceState(null, "", "#" + b.dataset.tab);
      window.scrollTo(0, 0);
    });
  });
  showTab(location.hash.slice(1));

  // 拡大表示
  var viewer = document.getElementById("viewer");
  var vImg = document.getElementById("viewer-img");
  var vTitle = document.getElementById("viewer-title");
  var vPos = document.getElementById("viewer-pos");
  var cur = { tab: "class", index: 0 };

  function render() {
    var list = lists[cur.tab];
    var p = list[cur.index];
    vImg.src = "posters/full/" + p.id + ".jpg";
    vImg.alt = p.name + " のポスター";
    vTitle.textContent = p.name;
    vPos.textContent = (cur.index + 1) + " / " + list.length;
    // 前後の画像を先読み
    [cur.index - 1, cur.index + 1].forEach(function (j) {
      if (list[j]) new Image().src = "posters/full/" + list[j].id + ".jpg";
    });
  }
  function move(step) {
    var n = lists[cur.tab].length;
    cur.index = (cur.index + step + n) % n;
    render();
  }
  function openViewer(tab, index) {
    cur = { tab: tab, index: index };
    render();
    viewer.hidden = false;
    document.body.style.overflow = "hidden";
    // Android の「戻る」で閉じられるように履歴を1つ積む
    history.pushState({ viewer: true }, "", location.hash || "#" + tab);
  }
  function hideViewer() {
    viewer.hidden = true;
    document.body.style.overflow = "";
  }
  function closeViewer() {
    if (history.state && history.state.viewer) history.back();
    else hideViewer();
  }
  window.addEventListener("popstate", function () { if (!viewer.hidden) hideViewer(); });

  document.getElementById("viewer-close").addEventListener("click", closeViewer);
  document.getElementById("viewer-prev").addEventListener("click", function () { move(-1); });
  document.getElementById("viewer-next").addEventListener("click", function () { move(1); });
  document.addEventListener("keydown", function (e) {
    if (viewer.hidden) return;
    if (e.key === "Escape") closeViewer();
    else if (e.key === "ArrowLeft") move(-1);
    else if (e.key === "ArrowRight") move(1);
  });

  // スワイプ（ピンチで拡大中は無視）
  var stage = document.getElementById("viewer-stage");
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) {
    if (e.touches.length !== 1) { sx = null; return; }
    sx = e.touches[0].clientX; sy = e.touches[0].clientY;
  }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null) return;
    var zoomed = window.visualViewport && window.visualViewport.scale > 1.05;
    var dx = e.changedTouches[0].clientX - sx;
    var dy = e.changedTouches[0].clientY - sy;
    sx = null;
    if (zoomed) return;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) move(dx < 0 ? 1 : -1);
  });
})();
</script>
</body>
</html>

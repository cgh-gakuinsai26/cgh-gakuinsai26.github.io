<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#4a050a">
<title>学院祭 出展ポスター</title>
<style>
  /* 常にダーク表示 */
  :root {
    color-scheme: dark;
    --bg: #120b08;
    --surface: #1f1512;
    --text: #f6ece0;
    --muted: #bda98f;
    --line: #3a2a20;
    --accent: #b3121b;
    --accent-text: #ffffff;
    --gold: #d4a93a;
    --header-bg: linear-gradient(180deg, #4a050a 0%, #7a0910 100%);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif;
    line-height: 1.5;
  }
  header {
    padding: 20px 16px 12px;
    padding-top: max(20px, env(safe-area-inset-top));
    text-align: center;
    background: var(--header-bg);
    border-bottom: 3px solid var(--gold);
    color: #fff;
  }
  header h1 { margin: 0; font-size: 1.35rem; letter-spacing: .04em; color: #f3dfa6; }
  header p { margin: 4px 0 0; color: rgba(255, 255, 255, .85); font-size: .85rem; }

  .tabs {
    position: sticky; top: 0; z-index: 10;
    display: flex; gap: 8px;
    padding: 10px 16px;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  .tabs button {
    flex: 1;
    padding: 12px 8px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--surface);
    color: var(--text);
    font: inherit; font-size: 1rem; font-weight: 600;
    cursor: pointer;
  }
  .tabs button[aria-selected="true"] {
    background: var(--accent); color: var(--accent-text); border-color: var(--gold);
  }
  .tabs .count { font-weight: 400; font-size: .8rem; opacity: .8; margin-left: 4px; }

  main { max-width: 960px; margin: 0 auto; padding: 8px 16px 40px; }
  .panel[hidden] { display: none; }
  .panel h2 {
    margin: 20px 0 10px; font-size: 1rem; color: var(--muted);
    border-left: 4px solid var(--gold); padding-left: 8px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
    margin: 0; padding: 0; list-style: none;
  }
  @media (min-width: 560px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (min-width: 820px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  .card {
    display: block; width: 100%;
    padding: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
    background: var(--surface); color: inherit; font: inherit; text-align: left;
    cursor: pointer;
  }
  .card img {
    display: block; width: 100%; aspect-ratio: 1 / 1.414; object-fit: cover;
    background: var(--line);
  }
  .card span { display: block; padding: 8px 10px; font-weight: 600; font-size: .95rem; }

  footer { text-align: center; color: var(--muted); font-size: .75rem; padding: 0 16px 32px; }

  /* 拡大表示 */
  .viewer {
    position: fixed; inset: 0; z-index: 100;
    display: flex; flex-direction: column;
    background: rgba(0, 0, 0, .97); color: #fff;
  }
  .viewer[hidden] { display: none; }
  .viewer-bar {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 8px 8px 16px;
    padding-top: max(8px, env(safe-area-inset-top));
  }
  .viewer-title { flex: 1; font-weight: 600; }
  .viewer-pos { color: #bbb; font-size: .85rem; }
  .viewer button {
    min-width: 44px; height: 44px;
    border: 0; border-radius: 999px;
    background: rgba(255, 255, 255, .14); color: #fff;
    font: inherit; font-size: 1.3rem; cursor: pointer;
  }
  .viewer-stage {
    flex: 1; min-height: 0;
    display: flex; align-items: center; justify-content: center;
    padding: 0 8px;
  }
  .viewer-stage img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .viewer-nav {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 16px;
    padding-bottom: max(10px, env(safe-area-inset-bottom));
  }
  .viewer-nav button { padding: 0 20px; font-size: 1rem; }
  .viewer-hint { color: #aaa; font-size: .8rem; }
  /* 下部の全体ポスター */
  .main-poster { max-width: 480px; margin: 36px auto 0; }
  .main-poster h2 {
    margin: 0 0 10px; font-size: 1rem; color: var(--muted);
    border-left: 4px solid var(--gold); padding-left: 8px;
  }
  .main-poster .card img { aspect-ratio: auto; object-fit: contain; }

  /* オープニング演出（幕が開いて全体ポスターが現れる） */
  .splash {
    position: fixed; inset: 0; z-index: 200;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at 50% 0%, #3a2a10 0%, #0b0705 60%, #000 100%);
    overflow: hidden;
    transition: opacity .7s ease, transform .7s ease;
  }
  .splash[hidden] { display: none; }
  .splash.leaving { opacity: 0; transform: scale(1.06); pointer-events: none; }
  .splash-spot {
    position: absolute; top: -20%; left: 50%; width: 140%; height: 140%;
    transform: translateX(-50%);
    background: radial-gradient(ellipse at 50% 20%, rgba(255, 228, 150, .35) 0%, rgba(255, 200, 80, .12) 30%, transparent 60%);
    opacity: 0; animation: spot 1.2s ease-out 1.1s forwards;
  }
  .splash-poster {
    position: relative; z-index: 1;
    max-width: min(80vw, 480px); max-height: 72vh; max-height: 72dvh;
    border-radius: 6px;
    box-shadow: 0 0 60px rgba(255, 200, 80, .45), 0 0 0 2px rgba(255, 215, 120, .6);
    opacity: 0; transform: scale(.92);
    animation: poster 1s ease-out .9s forwards;
  }
  .curtain {
    position: absolute; top: 0; bottom: 0; width: 51%; z-index: 3;
    background:
      repeating-linear-gradient(90deg, rgba(0,0,0,.35) 0 6px, rgba(255,255,255,.06) 12px, rgba(0,0,0,.25) 22px, rgba(0,0,0,.35) 28px),
      linear-gradient(180deg, #b3121b 0%, #8c0b12 60%, #5e060b 100%);
    box-shadow: inset 0 -40px 60px rgba(0,0,0,.5);
    animation-duration: 1.6s; animation-timing-function: cubic-bezier(.7, 0, .3, 1);
    animation-delay: .5s; animation-fill-mode: forwards;
  }
  /* 幕本体は clip-path で形を変え、外側の wrap の drop-shadow で金の縁と影を付ける */
  .curtain-wrap { position: absolute; top: 0; bottom: 0; width: 51%; z-index: 3; }
  .curtain-wrap.left { left: 0; filter: drop-shadow(2px 0 0 #d4a93a) drop-shadow(6px 6px 10px rgba(0,0,0,.55)); }
  .curtain-wrap.right { right: 0; filter: drop-shadow(-2px 0 0 #d4a93a) drop-shadow(-6px 6px 10px rgba(0,0,0,.55)); }
  .curtain-wrap .curtain { left: 0; right: 0; width: auto; }
  .curtain-left { animation-name: open-left; }
  .curtain-right { animation-name: open-right; }
  .valance {
    position: absolute; top: 0; left: 0; right: 0; height: 7vh; z-index: 4;
    background: linear-gradient(180deg, #7a0910, #a8121a 70%, #d4a93a 70%, #d4a93a 78%, transparent 78%);
  }
  .sparkle {
    position: absolute; z-index: 2; width: 6px; height: 6px; border-radius: 50%;
    background: #ffe39a; box-shadow: 0 0 8px 2px rgba(255, 220, 120, .8);
    opacity: 0; animation: sparkle 2.4s ease-in-out infinite;
  }
  .splash-ui {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 5;
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px; padding-bottom: max(14px, env(safe-area-inset-bottom));
    color: #f3dfa6; font-size: .85rem;
  }
  .splash-bar { flex: 1; height: 4px; border-radius: 2px; background: rgba(255,255,255,.15); overflow: hidden; }
  .splash-bar i { display: block; height: 100%; width: 0; background: #d4a93a; }
  .splash-skip {
    min-height: 40px; padding: 0 16px;
    border: 1px solid rgba(212, 169, 58, .7); border-radius: 999px;
    background: rgba(0,0,0,.4); color: #f3dfa6; font: inherit; font-size: .9rem; cursor: pointer;
  }
  @keyframes open-left {
    from { -webkit-clip-path: polygon(0.0% 0.0%, 100.0% 0.0%, 100.0% 5.0%, 100.0% 10.0%, 100.0% 15.0%, 100.0% 20.0%, 100.0% 25.0%, 100.0% 30.0%, 100.0% 35.0%, 100.0% 40.0%, 100.0% 45.0%, 100.0% 50.0%, 100.0% 55.0%, 100.0% 60.0%, 100.0% 65.0%, 100.0% 70.0%, 100.0% 75.0%, 100.0% 80.0%, 100.0% 85.0%, 100.0% 90.0%, 100.0% 95.0%, 100.0% 100.0%, 0.0% 100.0%); clip-path: polygon(0.0% 0.0%, 100.0% 0.0%, 100.0% 5.0%, 100.0% 10.0%, 100.0% 15.0%, 100.0% 20.0%, 100.0% 25.0%, 100.0% 30.0%, 100.0% 35.0%, 100.0% 40.0%, 100.0% 45.0%, 100.0% 50.0%, 100.0% 55.0%, 100.0% 60.0%, 100.0% 65.0%, 100.0% 70.0%, 100.0% 75.0%, 100.0% 80.0%, 100.0% 85.0%, 100.0% 90.0%, 100.0% 95.0%, 100.0% 100.0%, 0.0% 100.0%); }
    to { -webkit-clip-path: polygon(0.0% 0.0%, 42.0% 0.0%, 41.9% 4.6%, 41.5% 9.1%, 40.8% 13.5%, 39.9% 17.9%, 38.8% 22.2%, 37.4% 26.3%, 35.8% 30.3%, 34.0% 34.1%, 31.9% 37.7%, 29.7% 41.0%, 27.3% 44.1%, 24.7% 46.9%, 21.9% 49.5%, 19.1% 51.7%, 16.1% 53.6%, 13.0% 55.2%, 9.8% 56.4%, 6.6% 57.3%, 3.3% 57.8%, 0.0% 58.0%, 0.0% 100.0%); clip-path: polygon(0.0% 0.0%, 42.0% 0.0%, 41.9% 4.6%, 41.5% 9.1%, 40.8% 13.5%, 39.9% 17.9%, 38.8% 22.2%, 37.4% 26.3%, 35.8% 30.3%, 34.0% 34.1%, 31.9% 37.7%, 29.7% 41.0%, 27.3% 44.1%, 24.7% 46.9%, 21.9% 49.5%, 19.1% 51.7%, 16.1% 53.6%, 13.0% 55.2%, 9.8% 56.4%, 6.6% 57.3%, 3.3% 57.8%, 0.0% 58.0%, 0.0% 100.0%); }
  }
  @keyframes open-right {
    from { -webkit-clip-path: polygon(100.0% 0.0%, 0.0% 0.0%, 0.0% 5.0%, 0.0% 10.0%, 0.0% 15.0%, 0.0% 20.0%, 0.0% 25.0%, 0.0% 30.0%, 0.0% 35.0%, 0.0% 40.0%, 0.0% 45.0%, 0.0% 50.0%, 0.0% 55.0%, 0.0% 60.0%, 0.0% 65.0%, 0.0% 70.0%, 0.0% 75.0%, 0.0% 80.0%, 0.0% 85.0%, 0.0% 90.0%, 0.0% 95.0%, 0.0% 100.0%, 100.0% 100.0%); clip-path: polygon(100.0% 0.0%, 0.0% 0.0%, 0.0% 5.0%, 0.0% 10.0%, 0.0% 15.0%, 0.0% 20.0%, 0.0% 25.0%, 0.0% 30.0%, 0.0% 35.0%, 0.0% 40.0%, 0.0% 45.0%, 0.0% 50.0%, 0.0% 55.0%, 0.0% 60.0%, 0.0% 65.0%, 0.0% 70.0%, 0.0% 75.0%, 0.0% 80.0%, 0.0% 85.0%, 0.0% 90.0%, 0.0% 95.0%, 0.0% 100.0%, 100.0% 100.0%); }
    to { -webkit-clip-path: polygon(100.0% 0.0%, 58.0% 0.0%, 58.1% 4.6%, 58.5% 9.1%, 59.2% 13.5%, 60.1% 17.9%, 61.2% 22.2%, 62.6% 26.3%, 64.2% 30.3%, 66.0% 34.1%, 68.1% 37.7%, 70.3% 41.0%, 72.7% 44.1%, 75.3% 46.9%, 78.1% 49.5%, 80.9% 51.7%, 83.9% 53.6%, 87.0% 55.2%, 90.2% 56.4%, 93.4% 57.3%, 96.7% 57.8%, 100.0% 58.0%, 100.0% 100.0%); clip-path: polygon(100.0% 0.0%, 58.0% 0.0%, 58.1% 4.6%, 58.5% 9.1%, 59.2% 13.5%, 60.1% 17.9%, 61.2% 22.2%, 62.6% 26.3%, 64.2% 30.3%, 66.0% 34.1%, 68.1% 37.7%, 70.3% 41.0%, 72.7% 44.1%, 75.3% 46.9%, 78.1% 49.5%, 80.9% 51.7%, 83.9% 53.6%, 87.0% 55.2%, 90.2% 56.4%, 93.4% 57.3%, 96.7% 57.8%, 100.0% 58.0%, 100.0% 100.0%); }
  }
  @keyframes poster { to { opacity: 1; transform: scale(1); } }
  @keyframes spot { to { opacity: 1; } }
  @keyframes sparkle {
    0%, 100% { opacity: 0; transform: scale(.4); }
    50% { opacity: 1; transform: scale(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    .curtain-wrap, .valance, .sparkle { display: none; }
    .splash-poster, .splash-spot { animation-duration: .01s; animation-delay: 0s; }
  }
  /* 映画館ロビーの掲示風: 照明・金の額縁・名前のプレート */
  main { padding-top: 4px; }
  .grid { gap: 22px 16px; }
  .grid > li { position: relative; padding-top: 14px; }
  .grid > li::before {  /* 上からの照明 */
    content: ""; position: absolute; top: -6px; left: 10%; right: 10%; height: 70%;
    background: radial-gradient(ellipse at 50% 0%, rgba(255, 226, 150, .28) 0%, rgba(255, 210, 120, .08) 45%, transparent 70%);
    pointer-events: none; z-index: 0;
  }
  .grid > li::after {   /* 照明器具 */
    content: ""; position: absolute; top: 0; left: 50%; width: 34px; height: 8px;
    transform: translateX(-50%); border-radius: 0 0 8px 8px;
    background: linear-gradient(#5a4a2a, #2a2014); box-shadow: 0 4px 10px rgba(255, 220, 140, .6);
  }
  .card {
    position: relative; z-index: 1;
    border: 0; border-radius: 2px; background: transparent; overflow: visible;
  }
  .card img {
    padding: 5px; border-radius: 2px;
    background: linear-gradient(135deg, #8a6a22, #f0d27a 30%, #a8832c 55%, #f5dc8e 80%, #7a5c1c);
    box-shadow: 0 10px 22px rgba(0, 0, 0, .7), 0 0 18px rgba(255, 210, 120, .15);
  }
  .card span {
    width: fit-content; max-width: 100%; margin: 10px auto 0; padding: 3px 12px;
    border: 1px solid rgba(212, 169, 58, .7); border-radius: 3px;
    background: linear-gradient(#2a1d14, #1a110c);
    color: #f3dfa6; font-size: .85rem; letter-spacing: .06em; text-align: center;
  }
</style>
</head>
<body>
<div class="splash" id="splash" hidden>
  <div class="splash-spot"></div>
  <img class="splash-poster" id="splash-img" alt="学院祭 全体ポスター">
  <div class="curtain-wrap left"><div class="curtain curtain-left"></div></div>
  <div class="curtain-wrap right"><div class="curtain curtain-right"></div></div>
  <div class="valance"></div>
  <div class="splash-ui">
    <div class="splash-bar"><i id="splash-bar"></i></div>
    <button type="button" class="splash-skip" id="splash-skip">一覧へ ›</button>
  </div>
</div>

<header>
  <h1>学院祭 出展ポスター</h1>
  <p>見たい団体をタップすると大きく表示されます</p>
</header>

<nav class="tabs" role="tablist">
  <button role="tab" id="tab-class" aria-controls="panel-class" data-tab="class">クラス<span class="count" id="count-class"></span></button>
  <button role="tab" id="tab-club" aria-controls="panel-club" data-tab="club">部活<span class="count" id="count-club"></span></button>
</nav>

<main>
  <section class="panel" id="panel-class" role="tabpanel" aria-labelledby="tab-class"></section>
  <section class="panel" id="panel-club" role="tabpanel" aria-labelledby="tab-club"></section>
  <section class="main-poster" id="main-poster" hidden>
    <h2>学院祭 全体ポスター</h2>
  </section>
</main>

<footer>学院祭</footer>

<div class="viewer" id="viewer" hidden role="dialog" aria-modal="true" aria-labelledby="viewer-title">
  <div class="viewer-bar">
    <span class="viewer-title" id="viewer-title"></span>
    <span class="viewer-pos" id="viewer-pos"></span>
    <button type="button" id="viewer-close" aria-label="閉じる">✕</button>
  </div>
  <div class="viewer-stage" id="viewer-stage">
    <img id="viewer-img" alt="">
  </div>
  <div class="viewer-nav">
    <button type="button" id="viewer-prev">‹ 前</button>
    <span class="viewer-hint">左右にスワイプでも移動</span>
    <button type="button" id="viewer-next">次 ›</button>
  </div>
</div>

<script src="posters/data.js"></script>
<script>
(function () {
  var data = window.POSTERS || { classes: [], clubs: [] };
  var lists = { "class": data.classes, "club": data.clubs, "main": data.main ? [data.main] : [] };

  function card(p, tab, index) {
    var li = document.createElement("li");
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "card";
    btn.addEventListener("click", function () { openViewer(tab, index); });
    var img = document.createElement("img");
    img.src = "posters/thumb/" + p.id + ".jpg";
    img.alt = p.name + " のポスター";
    img.loading = "lazy";
    img.decoding = "async";
    var label = document.createElement("span");
    label.textContent = p.name;
    btn.appendChild(img);
    btn.appendChild(label);
    li.appendChild(btn);
    return li;
  }

  function grid() {
    var ul = document.createElement("ul");
    ul.className = "grid";
    return ul;
  }

  // クラスは学年ごとに見出しを付ける
  var classPanel = document.getElementById("panel-class");
  var currentGrade = null, ul = null;
  data.classes.forEach(function (p, i) {
    var g = String(p.grade);
    if (g !== currentGrade) {
      currentGrade = g;
      var h = document.createElement("h2");
      h.textContent = g.replace(/[0-9]/g, function (d) { return String.fromCharCode(d.charCodeAt(0) + 0xFEE0); }) + "年";
      classPanel.appendChild(h);
      ul = grid();
      classPanel.appendChild(ul);
    }
    ul.appendChild(card(p, "class", i));
  });

  var clubPanel = document.getElementById("panel-club");
  var clubGrid = grid();
  clubGrid.style.marginTop = "16px";
  data.clubs.forEach(function (p, i) { clubGrid.appendChild(card(p, "club", i)); });
  clubPanel.appendChild(clubGrid);

  // 一覧の下部に全体ポスター
  if (data.main) {
    var mainSec = document.getElementById("main-poster");
    var mainCard = card(data.main, "main", 0).firstChild;
    mainCard.querySelector("img").src = "posters/full/" + data.main.id + ".jpg";
    mainCard.querySelector("span").textContent = "タップで拡大";
    mainSec.appendChild(mainCard);
    mainSec.hidden = false;
  }

  document.getElementById("count-class").textContent = data.classes.length;
  document.getElementById("count-club").textContent = data.clubs.length;

  // タブ切り替え（URL の #class / #club で状態を保持）
  var tabs = document.querySelectorAll(".tabs button");
  function showTab(name) {
    if (name !== "class" && name !== "club") name = "class";
    tabs.forEach(function (b) {
      var on = b.dataset.tab === name;
      b.setAttribute("aria-selected", on ? "true" : "false");
      document.getElementById("panel-" + b.dataset.tab).hidden = !on;
    });
  }
  tabs.forEach(function (b) {
    b.addEventListener("click", function () {
      showTab(b.dataset.tab);
      history.replaceState(null, "", "#" + b.dataset.tab);
      window.scrollTo(0, 0);
    });
  });
  showTab(location.hash.slice(1));

  // 拡大表示
  var viewer = document.getElementById("viewer");
  var vImg = document.getElementById("viewer-img");
  var vTitle = document.getElementById("viewer-title");
  var vPos = document.getElementById("viewer-pos");
  var cur = { tab: "class", index: 0 };

  function render() {
    var list = lists[cur.tab];
    var p = list[cur.index];
    vImg.src = "posters/full/" + p.id + ".jpg";
    vImg.alt = p.name + " のポスター";
    vTitle.textContent = p.name;
    vPos.textContent = (cur.index + 1) + " / " + list.length;
    // 前後の画像を先読み
    [cur.index - 1, cur.index + 1].forEach(function (j) {
      if (list[j]) new Image().src = "posters/full/" + list[j].id + ".jpg";
    });
  }
  function move(step) {
    var n = lists[cur.tab].length;
    cur.index = (cur.index + step + n) % n;
    render();
  }
  function openViewer(tab, index) {
    cur = { tab: tab, index: index };
    render();
    viewer.hidden = false;
    document.body.style.overflow = "hidden";
    // Android の「戻る」で閉じられるように履歴を1つ積む
    history.pushState({ viewer: true }, "", location.hash || "#" + tab);
  }
  function hideViewer() {
    viewer.hidden = true;
    document.body.style.overflow = "";
  }
  function closeViewer() {
    if (history.state && history.state.viewer) history.back();
    else hideViewer();
  }
  window.addEventListener("popstate", function () { if (!viewer.hidden) hideViewer(); });

  document.getElementById("viewer-close").addEventListener("click", closeViewer);
  document.getElementById("viewer-prev").addEventListener("click", function () { move(-1); });
  document.getElementById("viewer-next").addEventListener("click", function () { move(1); });
  document.addEventListener("keydown", function (e) {
    if (viewer.hidden) return;
    if (e.key === "Escape") closeViewer();
    else if (e.key === "ArrowLeft") move(-1);
    else if (e.key === "ArrowRight") move(1);
  });

  // スワイプ（ピンチで拡大中は無視）
  var stage = document.getElementById("viewer-stage");
  var sx = null, sy = null;
  stage.addEventListener("touchstart", function (e) {
    if (e.touches.length !== 1) { sx = null; return; }
    sx = e.touches[0].clientX; sy = e.touches[0].clientY;
  }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (sx === null) return;
    var zoomed = window.visualViewport && window.visualViewport.scale > 1.05;
    var dx = e.changedTouches[0].clientX - sx;
    var dy = e.changedTouches[0].clientY - sy;
    sx = null;
    if (zoomed) return;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) move(dx < 0 ? 1 : -1);
  });
  // オープニング演出: QR から開いたとき（URL に # が付いていないとき）だけ表示し、数秒後に一覧へ
  (function () {
    if (!data.main || location.hash) return;
    var splash = document.getElementById("splash");
    var bar = document.getElementById("splash-bar");
    var OPEN_MS = 2100, HOLD_MS = 2400;
    var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduce) OPEN_MS = 300;
    document.getElementById("splash-img").src = "posters/full/" + data.main.id + ".jpg";
    for (var i = 0; i < 18 && !reduce; i++) {
      var s = document.createElement("span");
      s.className = "sparkle";
      s.style.left = (5 + Math.random() * 90) + "%";
      s.style.top = (8 + Math.random() * 80) + "%";
      s.style.animationDelay = (1.2 + Math.random() * 2.4).toFixed(2) + "s";
      splash.appendChild(s);
    }
    splash.hidden = false;
    document.body.style.overflow = "hidden";
    var done = false, start = null, timer;
    function tick(ts) {
      if (done) return;
      if (start === null) start = ts;
      var r = Math.min(1, Math.max(0, (ts - start - OPEN_MS) / HOLD_MS));
      bar.style.width = (r * 100) + "%";
      if (r < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
    function finish() {
      if (done) return;
      done = true;
      clearTimeout(timer);
      splash.classList.add("leaving");
      document.body.style.overflow = "";
      setTimeout(function () { splash.hidden = true; }, 700);
    }
    timer = setTimeout(finish, OPEN_MS + HOLD_MS);
    document.getElementById("splash-skip").addEventListener("click", finish);
  })();
})();
</script>

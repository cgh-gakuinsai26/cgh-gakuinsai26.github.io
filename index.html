<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<title>学院祭 出展ポスター</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: #000 url("main.jpg?v=9bbcdd61") center / cover no-repeat;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif;
  }
  main {
    min-height: 100vh; min-height: 100dvh;
    display: flex; align-items: flex-end; justify-content: center;
    padding: 24px 16px max(40px, env(safe-area-inset-bottom));
    background: linear-gradient(180deg, rgba(0,0,0,0) 35%, rgba(0,0,0,.55) 65%, rgba(0,0,0,.85) 100%);
  }
  .message {
    max-width: 560px; width: 100%;
    padding: 24px 20px;
    border: 1px solid rgba(212, 169, 58, .8); border-radius: 8px;
    background: rgba(10, 5, 3, .72);
    text-align: center; line-height: 1.9;
    box-shadow: 0 0 30px rgba(255, 200, 80, .25);
  }
  .message p { margin: 0; font-size: 1.1rem; font-weight: 600; letter-spacing: .04em; }
  .message span { display: inline-block; }  /* 語の途中で折り返さない */
  .message p:first-child { color: #f3dfa6; font-size: 1.2rem; }
</style>
</head>
<body>
<main>
  <div class="message">
    <p><span>2026年度の学院祭は</span><span>終了しました。</span></p>
    <p><span>ご来場ありがとう</span><span>ございました。</span></p>
  </div>
</main>
</body>
</html>
